name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - name: Smoke tests
        run: ./tests/smoke.sh
      - name: ShellCheck
        run: shellcheck reseed mode2-reset-evidence.sh 50-raphael-igpu-reset manual-reseed.sh diagnose.sh install.sh uninstall.sh tests/smoke.sh
